name: Artwork

# The SVGs in assets/ are generated and committed, because GitHub serves a
# profile README straight from the repository with no build step — there is no
# moment at which anything could be drawn on the way out.
#
# That makes it easy to edit scripts/make-art.mjs and forget to regenerate,
# which leaves the source and the picture quietly disagreeing. This catches it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the artwork
        run: node scripts/make-art.mjs

      - name: Check it matches what is committed
        run: |
          if ! git diff --quiet -- assets; then
            echo "::error::assets/ is out of date. Run 'node scripts/make-art.mjs' and commit the result."
            git diff --stat -- assets
            exit 1
          fi
          echo "assets/ matches the generator."
